name: System-Diagnostics-Windows

on:
  workflow_dispatch:

jobs:
  diagnostic-run:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Initialize Environment
        run: |
          # Hide standard RDP setup under a generic name
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0

          # Keep NLA enabled for security
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Provision Debug User
        shell: pwsh
        run: |
          # Generate random password
          $charList = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#"
          $randomPassword = -join ((1..16) | ForEach-Object { $charList[(Get-Random -Maximum $charList.Length)] })

          $user = "SystemDebug"
          $secPass = ConvertTo-SecureString $randomPassword -AsPlainText -Force

          New-LocalUser -Name $user -Password $secPass -FullName "Diagnostic Account" -Description "Temporary debug user"

          Add-LocalGroupMember -Group "Administrators" -Member $user
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user

          Write-Output "Username: $user"
          Write-Output "Password: $randomPassword"

      - name: Keep Session Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
